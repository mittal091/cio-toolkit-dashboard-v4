<!doctype html><meta charset="utf-8"><title>e2e</title><pre id="out">running</pre>
<style>iframe{position:absolute;left:-9999px;top:0;width:1280px;height:900px;border:0}</style>
<script>
const lines = []; let failed = 0;
const ok = (n, c, d = '') => { if (c) lines.push('PASS  ' + n); else { failed++; lines.push('FAIL  ' + n + (d ? '\n   ' + d : '')); } };
const wait = ms => new Promise(r => setTimeout(r, ms));
async function load(hash) {
  document.querySelectorAll('iframe').forEach(f => f.remove());
  const f = document.createElement('iframe'); f.src = '/index.html' + hash; document.body.appendChild(f);
  await new Promise(r => f.onload = r); await wait(500);
  return f;
}
const key = (w, el, k) => el.dispatchEvent(new w.KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
(async () => {
  try {
    let f = await load('#cockpit'); let d = f.contentDocument, w = f.contentWindow;
    d.defaultView.localStorage.clear();
    // ---- tabs: ARIA pattern ----
    const tabs = () => [...d.querySelectorAll('.tab')];
    ok('tablist roles: tabs have ids, aria-controls and a single tabindex=0', tabs().length === 8 && tabs().every(t => t.id && t.getAttribute('aria-controls') === 'view') && tabs().filter(t => t.tabIndex === 0).length === 1 && tabs()[0].tabIndex === 0);
    ok('tabpanel is labelled by the active tab', d.getElementById('view').getAttribute('aria-labelledby') === 'tab-cockpit' && d.getElementById('view').getAttribute('role') === 'tabpanel');
    tabs()[0].focus(); key(w, tabs()[0], 'ArrowRight'); await wait(150);
    ok('ArrowRight moves to the next tab, activates it and keeps focus on it', d.querySelector('.tab.on').dataset.id === 'fin' && d.activeElement.id === 'tab-fin' && d.activeElement.getAttribute('aria-selected') === 'true', d.activeElement.id);
    key(w, d.activeElement, 'End'); await wait(150);
    ok('End goes to the last tab (Board pack)', d.querySelector('.tab.on').dataset.id === 'pack' && d.activeElement.id === 'tab-pack');
    key(w, d.activeElement, 'ArrowRight'); await wait(150);
    ok('ArrowRight wraps from last to first', d.querySelector('.tab.on').dataset.id === 'cockpit');
    key(w, d.activeElement, 'ArrowLeft'); await wait(150);
    ok('ArrowLeft wraps from first to last', d.querySelector('.tab.on').dataset.id === 'pack');
    key(w, d.activeElement, 'Home'); await wait(150);
    ok('Home goes to the first tab and the URL hash follows', d.querySelector('.tab.on').dataset.id === 'cockpit' && w.location.hash === '#cockpit', w.location.hash);
    ok('only one tab is in the Tab sequence after moving', tabs().filter(t => t.tabIndex === 0).length === 1);

    // ---- evidence dialog ----
    const tile = d.querySelector('button.tile'); tile.focus(); tile.click(); await wait(200);
    const dlg = d.getElementById('detail');
    ok('clicking a tile opens a modal dialog with its evidence', dlg.open && dlg.querySelector('h2').textContent.length > 0 && dlg.textContent.includes('Source and accountability') && dlg.textContent.includes('Visible to'));
    ok('dialog is labelled by its title', dlg.getAttribute('aria-labelledby') === 'detail-title' && !!d.getElementById('detail-title'));
    dlg.dispatchEvent(new w.Event('cancel', { cancelable: true })); dlg.close(); await wait(150);
    ok('closing returns focus to the tile that opened it', d.activeElement === tile, d.activeElement.tagName + '.' + d.activeElement.className);
    // backdrop click closes
    tile.click(); await wait(150); dlg.dispatchEvent(new w.MouseEvent('click', { bubbles: true })); await wait(100);
    ok('clicking the backdrop closes the dialog', !dlg.open);
    // decision dialog from the attention table
    const rowbtn = d.querySelector('.rowbtn'); rowbtn.click(); await wait(150);
    ok('selecting an attention item opens the decision dialog', dlg.open && dlg.textContent.includes('Intended outcome') && dlg.textContent.includes('EXECUTIVE DECISION'));
    d.getElementById('close').click(); await wait(100);
    ok('the Close button closes the dialog', !dlg.open);

    // ---- role switch ----
    const role = d.getElementById('role'); role.value = 'finance'; role.dispatchEvent(new w.Event('change', { bubbles: true })); await wait(200);
    ok('switching to finance leaves two views and falls back to the first allowed one', tabs().map(t => t.dataset.id).join() === 'fin,ai' && d.querySelector('.tab.on').dataset.id === 'fin');
    ok('role choice is remembered for next visit', w.localStorage.getItem('cio-toolkit-role') === 'finance');
    role.value = 'cio'; role.dispatchEvent(new w.Event('change', { bubbles: true })); await wait(200);
    ok('tiles show no AI badge and the dialog explains AI in plain words', d.querySelectorAll('.tile .ai').length === 0);
    d.querySelector('button.tile').click(); await wait(150);
    ok('the evidence dialog states the AI value in plain words', /AI value:/.test(d.getElementById('detail').textContent) && /AI does real work|a person checks|small part|no AI involved/.test(d.getElementById('detail').textContent));
    d.getElementById('close').click(); await wait(100);

    // ---- decision log: status persists across a reload ----
    f = await load('#actions'); d = f.contentDocument; w = f.contentWindow; d.defaultView.localStorage.clear();
    const sel = d.querySelector('select[data-status="A3"]'); sel.value = 'Complete'; sel.dispatchEvent(new w.Event('change', { bubbles: true })); await wait(200);
    ok('changing a status shows a confirmation toast', d.getElementById('toast').style.display === 'block' && /saved/i.test(d.getElementById('toast').textContent));
    f = await load('#actions'); d = f.contentDocument;
    ok('status survives a page reload', d.querySelector('select[data-status="A3"]').value === 'Complete');
    f = await load('#cockpit'); d = f.contentDocument;
    ok('the cockpit shows the saved status as a badge', d.body.textContent.includes('Complete'));
    f = await load('#actions'); d = f.contentDocument; w = f.contentWindow;
    d.getElementById('reset-actions').click(); await wait(250);
    ok('Reset demo restores the defaults', d.querySelector('select[data-status="A3"]').value === 'Open' && d.querySelector('select[data-status="A1"]').value === 'In progress');

    // ---- layout: what a leader sees without scrolling ----
    async function loadSized(hash, w, hgt) {
      document.querySelectorAll('iframe').forEach(x => x.remove());
      const fr = document.createElement('iframe'); fr.style.cssText = `width:${w}px;height:${hgt}px`; fr.src = '/index.html' + hash; document.body.appendChild(fr);
      await new Promise(r => fr.onload = r); await wait(600); return fr;
    }
    let fr = await loadSized('#cockpit', 1366, 768); let dd = fr.contentDocument;
    const topOf = el => Math.round(el.getBoundingClientRect().top);
    const att = [...dd.querySelectorAll('.panel h3')].find(x => /attention/i.test(x.textContent)).parentElement;
    ok('laptop 1366x768: the banner starts within the top 250px', topOf(dd.querySelector('.briefing')) <= 250, String(topOf(dd.querySelector('.briefing'))));
    ok('laptop 1366x768: all four tiles and the first decisions are above the fold', [...dd.querySelectorAll('.tiles .tile')].every(t => t.getBoundingClientRect().bottom <= 768) && topOf(att) < 600, String(topOf(att)));
    fr = await loadSized('#cockpit', 390, 844); dd = fr.contentDocument;
    const visible = [...dd.querySelectorAll('.tiles .tile')].filter(t => t.getBoundingClientRect().bottom <= 844).length;
    ok('phone 390x844: at least two tiles are visible without scrolling', visible >= 2, String(visible));
    ok('phone 390x844: no sideways scrolling', dd.documentElement.scrollWidth <= dd.documentElement.clientWidth);
    ok('phone: there is no period control, only the role selector', !dd.getElementById('period') && !!dd.getElementById('role'));
    fr = await loadSized('#actions', 1366, 768); dd = fr.contentDocument;
    ok('the Ask jump link is hidden on views that have no Ask panel', !dd.querySelector('[data-askjump]'));
    fr = await loadSized('#fin', 1366, 768); dd = fr.contentDocument;
    ok('views with tiles explain the change arrows in one short line', dd.getElementById('meta').textContent.includes('change since the previous week or month'));
    const jump = dd.querySelector('[data-askjump]'); jump.click(); await wait(500);
    ok('Ask a question jumps to the Ask panel and focuses its input', dd.activeElement === dd.querySelector('[data-ask] input'), dd.activeElement.tagName);
    ok('the active-view pill is gone (the tab already says it)', !dd.body.textContent.includes('Viewing: '));
    // ---- board pack ----
    f = await load('#pack'); d = f.contentDocument;
    ok('board pack renders with Print and Download controls', !!d.getElementById('print-pack') && !!d.getElementById('download-pack') && d.querySelector('.pack').innerText.length > 800);
    ok('bar shows the data as-of date on every view', d.body.textContent.includes('Data as of: 12 Oct 2026'));

    // ---- Ask ----
    f = await load('#fin'); d = f.contentDocument; w = f.contentWindow;
    d.querySelectorAll('.q')[2].click(); await wait(150);
    ok('as the CIO, the vulnerability question is answered with sources', d.querySelector('.ans').textContent.includes('17 are open') && d.querySelectorAll('.ans .chip').length > 0);
    const r = d.getElementById('role'); r.value = 'finance'; r.dispatchEvent(new w.Event('change', { bubbles: true })); await wait(200);
    d.querySelectorAll('.q')[2].click(); await wait(150);
    ok('as finance, the same question is refused', d.querySelector('.ans').classList.contains('deny') && d.querySelector('.ans').textContent.includes('not available'));
    d.querySelector('.askf input').value = 'what drove the cloud cost spike'; d.querySelector('.askf').dispatchEvent(new w.Event('submit', { bubbles: true, cancelable: true })); await wait(150);
    ok('a typed question finds the matching sourced answer', d.querySelector('.ans').textContent.includes('Payments API'));
    // clean up persistent role
    w.localStorage.clear();
  } catch (e) { failed++; lines.push('FAIL runner: ' + e.message + '\n' + e.stack); }
  lines.push(failed ? `\n${failed} FAILED` : '\nALL PASSED');
  document.getElementById('out').textContent = lines.join('\n');
})();
</script>
